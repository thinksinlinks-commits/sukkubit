<style>
  :root {
    --bg: #05080b;
    --cyan: #00e5ff;
    --ink: #e8fcff;
    --dim: rgba(232, 252, 255, 0.55);
    --panel: rgba(6, 14, 18, 0.62);
    --line: rgba(0, 229, 255, 0.28);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: 'Cormorant Garamond', Georgia, serif; overscroll-behavior: none; }
  #scene { position: fixed; inset: 0; touch-action: none; }
  canvas { display: block; }

  header { pointer-events: none; }
  .nick { position: fixed; font-family: 'Rubik Glitch', monospace; font-size: 15px; letter-spacing: 1px; white-space: nowrap; z-index: 2; }

    display: none; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 4px 8px; font: 500 11px/1 'JetBrains Mono', monospace; color: var(--cyan); pointer-events: auto; }
  #inertia.on { display: flex; }
  #inertia input { width: 90px; accent-color: #00e5ff; }
  #dl { position: absolute; right: 10px; top: 8px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
    background: none; color: var(--cyan); cursor: pointer; display: grid; place-items: center; padding: 0; font: 15px/1 sans-serif; }
  #dl.done { color: #9ff8a0; border-color: rgba(159,248,160,.4); }
  .player { position: relative; }
  .nick.tr { top: calc(14px + env(safe-area-inset-top)); right: calc(12px + env(safe-area-inset-right)); }
  .nick .a { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
  .nick .s { font-size: 18px; color: #fff; }
  /* the world of the «s»: he thinks in links (cyan) / they think sin links (fire) */
  .nick .who { font-size: 11px; margin-right: 5px; color: var(--cyan); text-shadow: 0 0 8px var(--cyan); transition: color .3s, text-shadow .3s; }
  .nick .who.they { color: #ff5a1f; text-shadow: 0 0 8px #ff3300; }
  .logo { position: fixed; z-index: 4; pointer-events: auto; cursor: pointer; }   /* a tap brings the cube back to the contents */
  #logo { left: calc(6px + env(safe-area-inset-left)); top: calc(6px + env(safe-area-inset-top)); }
  /* ∆ in the bottom-right corner: straight to «Квант», the face opposite the contents */
  /* karaoke: over the open stage, the current line fills word by word */
  #karaoke { position: fixed; left: 0; right: 0; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 6; text-align: center;
    pointer-events: none; padding: 0 16px; opacity: 0; transition: opacity .4s; }
  body.staged.has-lyrics.k-on #karaoke, body.scene-on.has-lyrics.k-on #karaoke { opacity: 1; }
  /* «Суккубить» plays inside the cube: the lyrics sit in the gap between the cube and the magnet below it */
  body.scene-on:not(.staged) #karaoke { bottom: auto; top: var(--k-top, 70vh); }
  body.scene-on:not(.staged) .k-line { font-size: clamp(19px, 2.4vw, 32px); }
  body.scene-on:not(.staged) .k-line.next { font-size: clamp(13px, 1.5vw, 19px); margin-top: 2px; }
  /* the lyrics are off by default; «T» next to the quality turns them on (only for a track that has them) */
  #kbtn { display: none; font: 600 13px/1 'Cormorant Garamond', serif; color: var(--dim); background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 3px 9px; cursor: pointer; pointer-events: auto; }
  body.has-lyrics #kbtn { display: block; }
  body.k-on #kbtn { color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 8px rgba(0,229,255,.35); }
  .k-line { font: 500 clamp(22px, 3.4vw, 44px)/1.2 'Cormorant Garamond', serif; color: rgba(232,252,255,.38);
    text-shadow: 0 2px 12px rgba(0,0,0,.9), 0 0 2px #000; min-height: 1.2em; }
  .k-line.next { font-size: clamp(15px, 2vw, 24px); margin-top: 4px; color: rgba(232,252,255,.32); }
  .k-w { background: linear-gradient(90deg, #e8fcff var(--p, 0%), rgba(232,252,255,.38) var(--p, 0%));

  .k-w.sung { color: #e8fcff; background: none; text-shadow: 0 0 14px rgba(0,229,255,.55), 0 2px 12px rgba(0,0,0,.9); }
  #stagebtn { position: absolute; right: 10px; top: 8px; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line);
    background: none; color: var(--cyan); cursor: pointer; display: none; place-items: center; padding: 0; font: 15px/1 sans-serif; }
  body.can-expand #stagebtn { display: grid; }
  body.can-expand #dl { right: 44px; }
  /* the open stage is a plain <video> (hardware decoding) on the blurred 32x32 copy of itself */
  #stage-native { position: fixed; inset: 0; z-index: 5; display: none; background: #05080b; overflow: hidden; }
  body.native #stage-native { display: block; }
  #stage-amb { position: absolute; inset: -6%; width: 112%; height: 112%; filter: blur(28px) brightness(.34) saturate(1.15); }
  body.wide #stage-native video { width: min(100vw, 100vh * 16 / 9); height: min(100vh, 100vw * 9 / 16); }
  #stage-native video { position: absolute; inset: 0; margin: auto; width: min(98vw, 98vh); height: min(98vw, 98vh); object-fit: cover;
    --fade: linear-gradient(to right, transparent, #000 3%, #000 97%, transparent), linear-gradient(to bottom, transparent, #000 3%, #000 97%, transparent);
    -webkit-mask-image: var(--fade); mask-image: var(--fade); -webkit-mask-composite: source-in; mask-composite: intersect; }
  body.staged #view { z-index: 6; }

  @media (orientation: portrait) { footer { right: calc(10px + env(safe-area-inset-right)); width: auto; } }   /* phones: full width, so the title fits */

  .play { grid-row: span 2; width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--cyan);
    background: rgba(0, 229, 255, 0.08); color: var(--cyan); display: grid; place-items: center; cursor: pointer;
    box-shadow: 0 0 18px rgba(0, 229, 255, 0.25); transition: transform .15s, opacity .2s; }

  .play:disabled { opacity: 0.35; cursor: default; box-shadow: none; }
  .play svg { width: 22px; height: 22px; fill: currentColor; }
  .meta { padding-right: 70px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; min-width: 0; }
  .title { font-size: 24px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .load { position: absolute; left: 0; top: 8px; height: 2px; width: 0; background: rgba(232,252,255,.5); transition: width .2s; }
  .fill { position: absolute; left: 0; top: 8px; height: 2px; width: 0; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  .hint { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--dim); }

  .nav { position: fixed; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--line); background: var(--panel); color: var(--cyan); display: grid; place-items: center;
    cursor: pointer; opacity: .75; }
  /* magnets (Kling art): Viking helmet ← Rewind, horseshoe → Вы правы, pill ↓ Теневой опцион, snake & phoenix ↑ Новая фаза */
  .magnet { width: var(--mag, 56px); height: var(--mag, 56px); border: none; background: none; opacity: 1; padding: 0; }
  .magnet img { width: 100%; height: 100%; display: block; pointer-events: none;

  .magnet.pull img { filter: brightness(1.45) drop-shadow(0 0 12px #00e5ff) drop-shadow(0 0 20px rgba(255,70,40,.55)); transform: scale(1.12); }
  .magnet { transform: translate(-50%, -50%); z-index: 3; }   /* left/top are set by layoutMagnets() */
  @media (max-width: 420px) { .title { font-size: 21px; } }
  /* a phone on its side: a compact player (author, 2026-10-27: «на телефоне большие кнопки») */
  @media (orientation: landscape) and (max-height: 500px) {
    .player { padding: 7px 10px; border-radius: 14px; grid-template-columns: 38px 1fr; gap: 2px 9px; }
    .play { width: 38px; height: 38px; } .play svg { width: 16px; height: 16px; } .title { font-size: 18px; }
    .meta { flex-wrap: wrap; row-gap: 0; } .time { font-size: 11px; } }   /* the time goes under the title when it does not fit */

// ---------------- quality button
const qBtn = document.getElementById('quality');
function setQuality(q) {
  QUALITY = q; qBtn.textContent = QLABEL[q];
  PR = qPR(); renderer.setPixelRatio(PR); composer.setPixelRatio(PR); resize();
  useBloom = q === 'high' || (q === 'mid' && !LITE);
  if (stageTrack && stageVideo.src) {
    const tr = stageTrack, alive = () => QUALITY === q && stageTrack === tr;
    stageSrc(tr, q, meter(alive, tr, 'видео')).then(s => {
      if (!alive()) return;
      meterDone(tr);
      const was = !stageVideo.paused, t = stageVideo.currentTime;
      stageVideo.src = s; try { stageVideo.currentTime = t; } catch (e) {}
      syncStage(true); if (was) stageVideo.play().catch(() => {});
      dropVideoBlobs(clipName(tr), QDIR[q] + clipName(tr));
    }, () => { if (alive()) meterDone(tr); });
  }
  for (const v of videos) if (v.src) {                  // the new quality downloads, the old one plays meanwhile
    const name = v.dataset.name;
    videoSrc(name, q).then(s => {
      if (QUALITY !== q) return;
      const was = !v.paused, t = v.currentTime;
      v.src = s; try { v.currentTime = t; } catch (e) {}
      if (was) v.play().catch(() => {});
      dropVideoBlobs(name, QDIR[q] + name);
    }, () => {});
  }
}
qBtn.textContent = QLABEL[QUALITY];
qBtn.onclick = () => {
  const q = QUALITIES[(QUALITIES.indexOf(QUALITY) + 1) % QUALITIES.length];
  store.set('sk-quality', q); setQuality(q);
  hintFor(`видео ${QLABEL[q]}`);
};
function hintFor(text) {
  $('hint').textContent = text;
  clearTimeout(hintFor.t); hintFor.t = setTimeout(() => showFace(current), 1800);
}

// ---------------- the easter egg: drag the «s» of the nick: left — «кубит», right — «кубик»
const sEl = document.getElementById('nick-s');
const S_SHIFT = 6;
function placeS() { sEl.style.transform = `translateX(${FREE ? S_SHIFT : -S_SHIFT}px)`; }
const inEl = document.getElementById('inertia'), inRange = inEl.querySelector('input');
inRange.value = Math.round(INERTIA * 100);
inRange.oninput = () => { INERTIA = inRange.value / 100; store.set('sk-inertia', String(INERTIA)); };
inRange.addEventListener('pointerdown', e => e.stopPropagation());
function showInertia() { inEl.classList.toggle('on', FREE); }
const whoEl = document.getElementById('who');
function showWorld() { whoEl.textContent = WORLD; whoEl.classList.toggle('they', WORLD === 'they'); }
// the other world: the tracks move to their faces there, the magnets follow, the codes invert
function setWorld(w) {
  if (w === WORLD) return;
  const was = current >= 0 ? trackOnFace(current) : null;
  WORLD = w; placeWorld(); fillFaces();
  cube.material.forEach((m, f) => { m.map = faceTex[f]; });
  ghosts.forEach(g => g.material.forEach((m, f) => { m.map = faceTex[f]; }));
  keepUpright(); placeMagnets(); layoutMagnets(); skWorld(); showWorld();
  contents.next = 0; for (const a of animated) a.next = 0;
  if (was && was.face !== CONTENTS_FACE && !FREE) goTo(was.face);   // the track stays in front: the cube turns to where it lives now
  showFace(nearestFace()); syncVideos(true);
}
function setMode(free) {
  showInertia();
  if (free === FREE) return placeS();
  FREE = free; store.set('sk-mode', free ? 'кубик' : 'кубит'); placeS(); showInertia();
  setWorld(free ? 'they' : 'he');
  if (free) { vel.set(220, -140); seeking = false; }          // a push, so the new freedom is felt at once
  else goTo(nearestFace());                                 // back to quarter turns: snap to the nearest face
  if (tg && tg.HapticFeedback) try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
  hintFor(free ? 'they think sin links · кубик' : 'he thinks in links · кубит');
}
placeS(); showInertia(); showWorld();
let sDrag = null;
sEl.addEventListener('pointerdown', e => { sDrag = { x: e.clientX }; sEl.classList.add('drag'); sEl.setPointerCapture(e.pointerId); e.stopPropagation(); });
sEl.addEventListener('pointermove', e => {
  if (!sDrag) return;
  const dx = Math.max(-14, Math.min(14, e.clientX - sDrag.x + (FREE ? S_SHIFT : -S_SHIFT)));
  sEl.style.transform = `translateX(${dx}px)`;
});
sEl.addEventListener('pointerup', e => {
  if (!sDrag) return;
  const dx = e.clientX - sDrag.x; sDrag = null; sEl.classList.remove('drag');
  if (dx < -4) setMode(false); else if (dx > 4) setMode(true); else placeS();
});
sEl.addEventListener('pointercancel', () => { sDrag = null; sEl.classList.remove('drag'); placeS(); });

// ---------------- download the album to the device (encrypted, for offline listening)
const dlBtn = document.getElementById('dl');
const withAudio = TRACKS.filter(t => t.audio);
async function refreshDl() {
  if (!ENCRYPTED) { dlBtn.style.display = 'none'; return; }
  const n = (await Promise.all(withAudio.map(t => isCached(t.audio)))).filter(Boolean).length;
  dlBtn.classList.toggle('done', n === withAudio.length);
  dlBtn.title = n === withAudio.length ? 'Альбом сохранён на устройстве' : 'Скачать альбом на устройство';
}
dlBtn.onclick = async () => {
  unlockMedia();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  let done = 0;
  try {
    await mediaKey();
    for (const tr of withAudio) {
      hintFor(`скачивание ${done + 1}/${withAudio.length}…`); clearTimeout(hintFor.t);
      await cachedBin(tr.audio); done++;
    }
    hintFor('альбом сохранён на устройстве');
  } catch (e) { hintFor('не удалось скачать: нет доступа или сети'); }
  refreshDl();
};
refreshDl();

// ---------------- PWA: install as an app, the shell works offline (see sw.js)
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

showFace(CONTENTS_FACE);
requestAnimationFrame(frame);
</script>
</body>
