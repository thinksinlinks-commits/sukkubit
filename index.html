{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

// ------------------------------------------------------------------ album data
// BoxGeometry face order: +x, -x, +y, -y, +z, -z. The contents face (+z) is opposite Rewind (-z).
// code: the track's number in the contents; arrow: the swipe/arrow that brings it from the contents.
// Квант (∆) is opposite the contents: two turns away. The binary codes 00/01/10/11 sit on the four neighbours.
const TRACKS = [
  { code: '∆',  arrow: '',  title: 'Квант',          face: 5, video: 'assets/kvant.mp4', full: 'assets/kvant-full.mp4', audio: 'assets/kvant.mp3.bin' },
  { code: '00', arrow: '←', title: 'Rewind',         face: 0, video: 'assets/rewind.mp4', full: 'assets/rewind-clip.mp4', sync: true, wide: true, lyrics: 'assets/rewind-lyrics.json', audio: 'assets/rewind.m4a.bin' },
  { code: '01', arrow: '→', title: 'Вы правы',       face: 1, video: 'assets/vy-pravy.mp4',       audio: 'assets/vy-pravy.mp3.bin' },
  { code: '10', arrow: '↓', title: 'Теневой опцион', face: 2, video: 'assets/tenevoy-option.mp4', audio: 'assets/tenevoy-option.mp3.bin' },
  { code: '11', arrow: '↑', title: 'Новая фаза',     face: 3, video: 'assets/novaya-faza.mp4', full: 'assets/novaya-faza-full.mp4', audio: 'assets/novaya-faza.mp3.bin' },
];
const CONTENTS_FACE = 4;
// the orientation that turns each face to the viewer, upright
const FACE_Q = [
  new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -Math.PI / 2, 0)),
  new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI / 2, 0)),
  new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.PI / 2, 0, 0)),
  new THREE.Quaternion().setFromEuler(new THREE.Euler(-Math.PI / 2, 0, 0)),
  new THREE.Quaternion(),
  new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.PI, 0)),
];

const tg = window.Telegram && window.Telegram.WebApp;
if (tg && tg.platform && tg.platform !== 'unknown') {   // only inside Telegram
  try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
// Media (mp3/mp4) is served only to a validated Telegram session: the server checks initData and sets a cookie.
// Outside Telegram (a local browser) there is no initData and the local server lets media through as is.
// A browser without Telegram comes with an invite link (?k=…, issued by the bot's /link): it is exchanged for the cookie.
const inviteKey = new URLSearchParams(location.search).get('k');
// CDN mode (the build for GitHub Pages sets ENCRYPTED = true): videos are public, tracks are AES-GCM encrypted
// .bin files; the key comes from the home server (the tunnel) for a Telegram user or an invite link.
const ENCRYPTED = true;
const session = ENCRYPTED ? Promise.resolve() : (tg && tg.initData)
  ? fetch('api/session', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData }), credentials: 'same-origin' }).catch(() => {})
  : inviteKey
    ? fetch('api/invite?k=' + encodeURIComponent(inviteKey), { credentials: 'same-origin' }).catch(() => {})
    : Promise.resolve();

const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let apiBase = null;
async function api() {
  if (apiBase) return apiBase;
  const q = new URLSearchParams(location.search).get('api');      // the bot passes the current tunnel address
  if (q) return (apiBase = q.replace(/\/$/, ''));
  const r = await fetch('api.json?ts=' + Date.now());              // otherwise: written by start-tunnel.ps1
  return (apiBase = (await r.json()).api.replace(/\/$/, ''));
}
let keyP = null;
function mediaKey() {
  return keyP || (keyP = (async () => {
    try {
      const saved = JSON.parse(store.get('sk-key') || 'null');
      if (saved && saved.exp * 1000 > Date.now()) return importKey(saved.key);
    } catch (e) {}
    const body = tg && tg.initData ? { initData: tg.initData } : { k: inviteKey || '' };
    const r = await fetch((await api()) + '/api/key', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (!r.ok) throw new Error('no access');
    const j = await r.json();
    store.set('sk-key', JSON.stringify({ key: j.key, exp: j.exp }));
    return importKey(j.key);
  })().catch(e => { keyP = null; throw e; }));
}
function importKey(b64) {
  const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
}
// encrypted tracks are kept in the device's Cache Storage: downloaded once, then played offline
const MEDIA_CACHE = 'sk-media-v1';
async function cachedBin(url) {
  try {
    const c = await caches.open(MEDIA_CACHE);
    const hit = await c.match(url);
    if (hit) return hit.arrayBuffer();
    const r = await fetch(url);
    if (!r.ok) throw new Error(r.status);
    await c.put(url, r.clone());
    return r.arrayBuffer();
  } catch (e) {
    return fetch(url).then(r => r.arrayBuffer());       // no Cache Storage (old webview): plain download
  }
}
async function isCached(url) {
  try { return !!(await (await caches.open(MEDIA_CACHE)).match(url)); } catch (e) { return false; }
}
const blobs = new Map();
function trackSrc(tr) {
  if (!ENCRYPTED) return Promise.resolve(tr.audio);
  if (!blobs.has(tr)) blobs.set(tr, (async () => {
    const [key, buf] = await Promise.all([mediaKey(), cachedBin(tr.audio)]);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    return URL.createObjectURL(new Blob([plain], { type: tr.audio.includes('.m4a') ? 'audio/mp4' : 'audio/mpeg' }));
  })().catch(e => { blobs.delete(tr); throw e; }));
  return blobs.get(tr);
}
// a tiny silent clip played inside the tap: it unlocks the audio element, so the real track may start later (iOS)
const SILENT = (() => {
  const n = 800, b = new ArrayBuffer(44 + n), v = new DataView(b);
  const w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
  w(0, 'RIFF'); v.setUint32(4, 36 + n, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, 8000, true); v.setUint32(28, 8000, true);
  v.setUint16(32, 1, true); v.setUint16(34, 8, true); w(36, 'data'); v.setUint32(40, n, true);
  new Uint8Array(b, 44).fill(128);
  return URL.createObjectURL(new Blob([b], { type: 'audio/wav' }));
})();

// ------------------------------------------------------------------ scene
const host = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
// LITE: phones (and Telegram on phones) get light videos, no bloom, pixel ratio 1, fewer particles;
// covers load only when their face is opened, and the track always goes first
const LITE = /android|iphone|ipad|ipod|mobile/i.test(navigator.userAgent)
  || (tg && /^(android|ios)/.test(tg.platform || '')) || Math.min(screen.width, screen.height) < 600 || new URLSearchParams(location.search).has('lite');
// quality: the viewer's choice (the button under the nick), remembered on the device
const QUALITIES = ['low', 'mid', 'high'], QLABEL = { low: '360p', mid: '720p', high: '1080p' };
const QDIR = { low: 'assets/m/', mid: 'assets/', high: 'assets/hd/' };
const qChosen = store.get('sk-quality');
let QUALITY = QUALITIES.includes(qChosen) ? qChosen : (LITE ? 'low' : 'mid');
const qPR = () => QUALITY === 'low' ? 1 : QUALITY === 'mid' ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2);
let PR = qPR();
renderer.setPixelRatio(PR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
host.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05080b);
const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 100);
camera.position.set(0, 0, 7.2);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1, 1), 0.35, 0.5, 0.86);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ------------------------------------------------------------------ face textures
const TEX = 1024;                     // layout units of a face canvas
const TEX_PX = LITE ? 512 : 1024;     // its real pixel size (phones: half)
function canvasTexture(draw) {
  const c = document.createElement('canvas'); c.width = c.height = TEX_PX;
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
  const ctx = c.getContext('2d');
  ctx.scale(TEX_PX / TEX, TEX_PX / TEX);   // draw in 1024 layout units at any pixel size
  return { c, ctx, tex, draw };
}
function drawNick(ctx, y, size) {
  const parts = [['think', '#e8fcff', size], ['<-', '#00e5ff', size], ['s', '#ffffff', size * 1.22],
                 ['->', '#00e5ff', size], ['inlinks', '#e8fcff', size]];
  let total = 0;
  for (const [t, , s] of parts) { ctx.font = `${s}px "Rubik Glitch"`; total += ctx.measureText(t).width; }
  let x = (TEX - total) / 2;
  ctx.textBaseline = 'middle';
  for (const [t, col, s] of parts) {
    ctx.font = `${s}px "Rubik Glitch"`; ctx.fillStyle = col;
    ctx.shadowColor = col === '#00e5ff' ? '#00e5ff' : 'transparent'; ctx.shadowBlur = col === '#00e5ff' ? 12 : 0;
    ctx.fillText(t, x, y); x += ctx.measureText(t).width;
  }
  ctx.shadowBlur = 0;
}
// ------------------------------------------------------------------ logo «Суккубить»
// Every side of the square is the same line «суккубить», read in its own direction:
//            с
//            у

  if (t < logoNext) return; logoNext = t + 0.08;
  const dpr = Math.min(window.devicePixelRatio || 1, 2), w = logoWidth(LOGO_CELL) + 12, h = logoHeight(LOGO_CELL) + 8;
  if (logoCv.width !== Math.round(w * dpr)) { logoCv.width = Math.round(w * dpr); logoCv.height = Math.round(h * dpr);
    logoCv.style.width = w + 'px'; logoCv.style.height = h + 'px'; }
  logoCtx.setTransform(dpr, 0, 0, dpr, 0, 0); logoCtx.clearRect(0, 0, w, h);
  drawLogo(logoCtx, w / 2, 4, LOGO_CELL, t);
}

const clock = new THREE.Clock();
let useBloom = QUALITY === 'high' || (QUALITY === 'mid' && !LITE), slowFor = 0, avgDt = 1 / 60;
function adapt(dt) {
  if (qChosen) return;                                 // the viewer picked a quality: respect it
  avgDt = avgDt * 0.95 + dt * 0.05;
  slowFor = avgDt > 1 / 40 ? slowFor + dt : 0;
  if (slowFor > 2) {                                   // two seconds under ~40 fps: step the quality down
    slowFor = 0;
    if (PR > 1) { PR = 1; renderer.setPixelRatio(1); composer.setPixelRatio(1); resize(); }
    else if (useBloom) useBloom = false;
    else if (LITE && PR > 0.75) { PR = 0.75; renderer.setPixelRatio(PR); composer.setPixelRatio(PR); resize(); }
  }
}
let collapse = 0, settledFace = -1;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
  if (FREE && !dragging && !seeking) {               // «кубик»: inertia, slowly fading
    spinFree(vel.x * COAST * dt, vel.y * COAST * dt);
    vel.multiplyScalar(Math.pow(0.5, dt / inertiaHalfLife()));   // the inertia slider: how long it keeps spinning
    target.copy(cube.quaternion);
  } else if (!dragging) cube.quaternion.slerp(target, 1 - Math.pow(0.002, dt));
  if (seeking && cube.quaternion.angleTo(target) < 0.01) seeking = false;
  // uncertainty: high while the cube is moving, collapses to 0 when it settles on a face
  const off = cube.quaternion.angleTo(target);
  const moving = dragging || off > 0.02 || (FREE && vel.lengthSq() > 25);
  uncertainty += ((moving ? 1 : 0) - uncertainty) * (moving ? 0.08 : 0.12);
  const f = nearestFace();
  if (!moving && off < 0.02 && settledFace !== f) { settledFace = f; collapse = 1; showFace(f); }
  if (moving) settledFace = -1;
  collapse *= 0.9;
  // idle life: the cube floats and breathes a little around its face
  const bob = Math.sin(t * 1.1) * 0.06;
  const pa = pullAmount(t);
  const reach = Math.max(0, MAG_R - CUBE_HALF - 50) / PX_PER_UNIT;   // stop just short of the magnet
  cube.position.x = pa ? PULL[pa.dir][0] * pa.v * reach : 0;
  cube.position.y = bob + (pa ? PULL[pa.dir][1] * pa.v * reach : 0);
  const sway = new THREE.Quaternion().setFromEuler(new THREE.Euler(Math.sin(t * 0.7) * 0.035, Math.sin(t * 0.5) * 0.05, 0));
  const shown = cube.quaternion.clone();
  cube.quaternion.multiply(sway);
  ghosts.forEach((g, i) => {
    const s = i ? 1 : -1, u = uncertainty * 0.9 + Math.max(0, Math.sin(t * 0.9 + i * 2.1)) ** 8 * 0.35;
    g.quaternion.copy(cube.quaternion).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0.12 * s * u, -0.2 * s * u, 0.05 * u)));
    g.position.set(cube.position.x + 0.55 * s * u, cube.position.y - 0.15 * s * u, -0.2 * u);
    g.material.forEach(m => { m.opacity = 0.16 * u; });
    g.userData.edge.material.opacity = 0.5 * u;
    g.visible = QUALITY !== 'low' && u > 0.02;            // phones: no ghost copies (two extra cube renders)
  });
  edgeMat.opacity = 0.75 + 0.25 * Math.sin(t * 2.3) + collapse;
  bloom.strength = 0.3 + collapse * 0.8;
  halo.material.uniforms.uT.value = t;
  particles.rotation.y = t * 0.02; particles.rotation.x = Math.sin(t * 0.1) * 0.05;
  for (const a of animated) {
    // canvas faces are expensive (2D shadows + a 1024² upload): ~12 fps, and only while the face can be seen
    const fz = NORMALS[a === contents ? CONTENTS_FACE : faceTex.indexOf(a.tex)].clone().applyQuaternion(cube.quaternion).z;
    if (fz > 0.2 && t >= (a.next || 0)) { a.draw(a.ctx, t); a.tex.needsUpdate = true; a.next = t + (a === contents ? 0.08 : 0.15); }
  }
  drawHeaderLogo(t);
  syncVideos(false);
  adapt(dt);
  if (stageP < 1) { if (useBloom) composer.render(); else renderer.render(scene, camera); }
  stageFrame(dt);
  drawFx(t, pa);
  updateDelta(dt);
  cube.quaternion.copy(shown);
  requestAnimationFrame(frame);
}
// draw canvases once the web fonts are ready (redraw the contents face after that)
Promise.all(['48px "Rubik Glitch"', '62px "Cormorant Garamond"', '500 40px "JetBrains Mono"']
  .map(f => document.fonts.load(f)));
// ---------------- quality button
const qBtn = document.getElementById('quality');
function setQuality(q) {
  QUALITY = q; qBtn.textContent = QLABEL[q];
  PR = qPR(); renderer.setPixelRatio(PR); composer.setPixelRatio(PR); resize();
  useBloom = q === 'high' || (q === 'mid' && !LITE);
  if (stageTrack && stageVideo.src) { const was = !stageVideo.paused; stageVideo.src = QDIR[q] + (stageTrack.full || stageTrack.video).split('/').pop(); if (was) stageVideo.play().catch(() => {}); }
  for (const v of videos) if (v.src) { const was = !v.paused; v.src = QDIR[q] + v.dataset.name; if (was) v.play().catch(() => {}); }
}
qBtn.textContent = QLABEL[QUALITY];
qBtn.onclick = () => {
  const q = QUALITIES[(QUALITIES.indexOf(QUALITY) + 1) % QUALITIES.length];
  store.set('sk-quality', q); setQuality(q);
  hintFor(`видео ${QLABEL[q]}`);
};
function hintFor(text) {
  $('hint').textContent = text;
  clearTimeout(hintFor.t); hintFor.t = setTimeout(() => showFace(current), 1800);
}

// ---------------- the easter egg: drag the «s» of the nick: left — «кубит», right — «кубик»
const sEl = document.getElementById('nick-s');
const S_SHIFT = 6;
function placeS() { sEl.style.transform = `translateX(${FREE ? S_SHIFT : -S_SHIFT}px)`; }
const inEl = document.getElementById('inertia'), inRange = inEl.querySelector('input');
inRange.value = Math.round(INERTIA * 100);
inRange.oninput = () => { INERTIA = inRange.value / 100; store.set('sk-inertia', String(INERTIA)); };
inRange.addEventListener('pointerdown', e => e.stopPropagation());
function showInertia() { inEl.classList.toggle('on', FREE); }
function setMode(free) {
  showInertia();
  if (free === FREE) return placeS();
  FREE = free; store.set('sk-mode', free ? 'кубик' : 'кубит'); placeS(); showInertia();
  if (free) { vel.set(220, -140); seeking = false; }          // a push, so the new freedom is felt at once
  else goTo(nearestFace());                                 // back to quarter turns: snap to the nearest face
  if (tg && tg.HapticFeedback) try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {}
  hintFor(free ? 'режим: кубик' : 'режим: кубит');
}
placeS(); showInertia();
let sDrag = null;
sEl.addEventListener('pointerdown', e => { sDrag = { x: e.clientX }; sEl.classList.add('drag'); sEl.setPointerCapture(e.pointerId); e.stopPropagation(); });
sEl.addEventListener('pointermove', e => {
  if (!sDrag) return;
  const dx = Math.max(-14, Math.min(14, e.clientX - sDrag.x + (FREE ? S_SHIFT : -S_SHIFT)));
  sEl.style.transform = `translateX(${dx}px)`;
});
sEl.addEventListener('pointerup', e => {
  if (!sDrag) return;
  const dx = e.clientX - sDrag.x; sDrag = null; sEl.classList.remove('drag');
  if (dx < -4) setMode(false); else if (dx > 4) setMode(true); else placeS();
});
sEl.addEventListener('pointercancel', () => { sDrag = null; sEl.classList.remove('drag'); placeS(); });

// ---------------- download the album to the device (encrypted, for offline listening)
const dlBtn = document.getElementById('dl');
const withAudio = TRACKS.filter(t => t.audio);
async function refreshDl() {
  if (!ENCRYPTED) { dlBtn.style.display = 'none'; return; }
  const n = (await Promise.all(withAudio.map(t => isCached(t.audio)))).filter(Boolean).length;
  dlBtn.classList.toggle('done', n === withAudio.length);
  dlBtn.title = n === withAudio.length ? 'Альбом сохранён на устройстве' : 'Скачать альбом на устройство';
}
dlBtn.onclick = async () => {
  unlockMedia();
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  let done = 0;
  try {
    await mediaKey();
    for (const tr of withAudio) {
      hintFor(`скачивание ${done + 1}/${withAudio.length}…`); clearTimeout(hintFor.t);
      await cachedBin(tr.audio); done++;
    }
    hintFor('альбом сохранён на устройстве');
  } catch (e) { hintFor('не удалось скачать: нет доступа или сети'); }
  refreshDl();
};
refreshDl();

// ---------------- PWA: install as an app, the shell works offline (see sw.js)
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});

showFace(CONTENTS_FACE);
requestAnimationFrame(frame);
</script>
